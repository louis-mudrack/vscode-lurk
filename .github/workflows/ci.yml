name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Extracted UI strings are up to date
        run: npm run l10n && git diff --exit-code -- l10n
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: lurk-vsix
          path: '*.vsix'
          if-no-files-found: error
