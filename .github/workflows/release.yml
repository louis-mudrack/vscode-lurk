name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run package
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found && !/^\[/ { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.vsix --title "Lurk $GITHUB_REF_NAME" --notes-file release-notes.md

  # Runs only once Microsoft Entra ID publishing is set up (see CONTRIBUTING.md);
  # Azure DevOps no longer issues the global PATs the Marketplace needs.
  marketplace:
    needs: release
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Download the released .vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.vsix'
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish to the Visual Studio Marketplace
        run: npx --yes @vscode/vsce@4.0.0 publish --packagePath ./*.vsix --azure-credential --skip-duplicate
