<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="vscode-theme.css" />
    <link rel="stylesheet" href="../../player.css" />
    <style>
      .video {
        background: url(stream-art.svg) center/cover;
      }
      .control-bar {
        opacity: 1;
      }
      .raid-banner {
        animation: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="stage">
        <div class="video-frame">
          <div class="video"></div>
          <div class="raid-banner">
            <svg viewBox="0 0 24 24" class="icon">
              <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z" /></svg
            ><span>pixel_pirate raided CozyCoder</span>
          </div>
          <div class="control-bar">
            <button class="icon-button">
              <svg viewBox="0 0 24 24" class="icon">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
              </svg>
            </button>
            <div class="volume-group">
              <button class="icon-button">
                <svg viewBox="0 0 24 24" class="icon">
                  <path
                    d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.48 4.48 0 0 0 16.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"
                  />
                </svg></button
              ><input class="volume-slider" type="range" min="0" max="1" step="0.01" value="0.7" />
            </div>
            <span class="live-badge">LIVE</span><span class="spacer"></span>
            <div class="quality-anchor">
              <button class="quality-button">
                <svg viewBox="0 0 24 24" class="icon">
                  <path
                    d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.47.41l-.36 2.54a7.4 7.4 0 0 0-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54a7 7 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"
                  /></svg
                ><span class="quality-label">Auto · 720p60</span>
              </button>
            </div>
            <button class="icon-button">
              <svg viewBox="0 0 24 24" class="icon">
                <path
                  d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"
                />
              </svg>
            </button>
          </div>
        </div>
        <div class="stream-info">
          <div class="info-row">
            <img
              class="avatar"
              src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Ccircle cx='10' cy='10' r='10' fill='%239d6bff'/%3E%3Ccircle cx='10' cy='8' r='3.5' fill='%23fff'/%3E%3Cpath d='M4 17c1-4 11-4 12 0z' fill='%23fff'/%3E%3C/svg%3E"
            /><span class="info-name">CozyCoder</span
            ><span class="info-game">· Software and Game Development</span
            ><span class="spacer"></span
            ><span class="info-viewers-group"
              ><svg viewBox="0 0 24 24" class="icon">
                <path
                  d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"
                /></svg
              ><span class="info-viewers">1.2K</span></span
            >
          </div>
          <div class="info-title">Building a VS Code extension live – come hang out!</div>
        </div>
      </div>
    </div>
  </body>
</html>
