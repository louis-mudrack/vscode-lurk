<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 640px;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        gap: 72px;
        padding: 0 110px;
        box-sizing: border-box;
        background:
          radial-gradient(circle at 18% 30%, rgba(157, 107, 255, 0.35), transparent 55%),
          radial-gradient(circle at 90% 90%, rgba(255, 59, 92, 0.18), transparent 45%),
          linear-gradient(135deg, #1b1030, #0e0a1a);
        font-family: 'Inter', sans-serif;
        color: #fff;
      }
      img {
        width: 300px;
        height: 300px;
        filter: drop-shadow(0 24px 48px rgba(0, 0, 0, 0.45));
      }
      h1 {
        margin: 0;
        font-family: 'Inter Display', 'Inter', sans-serif;
        font-weight: 800;
        font-size: 132px;
        letter-spacing: -4px;
        line-height: 1;
      }
      .tagline {
        margin: 18px 0 0;
        font-size: 34px;
        white-space: nowrap;
        font-weight: 600;
        color: #e9ddff;
      }
      .features {
        margin: 26px 0 0;
        font-size: 24px;
        color: #b9a7dc;
      }
      .aka {
        margin: 30px 0 0;
        font-size: 20px;
        color: #8a7aa8;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <img src="../logo.svg" alt="" />
    <div>
      <h1>Lurk</h1>
      <p class="tagline">Twitch streams in your VS Code sidebar</p>
      <p class="features">Live video &amp; sound · Chat with 7TV emotes · Follows raids</p>
      <p class="aka">a.k.a. Arbeitszeitbetrug</p>
    </div>
  </body>
</html>
