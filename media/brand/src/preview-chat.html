<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="vscode-theme.css" />
    <link rel="stylesheet" href="../../chat.css" />
  </head>
  <body>
    <div id="app">
      <div class="chat-list">
        <div class="chat-scroller">
          <div class="system-line">
            <div class="system-text">pixel_pirate is raiding with a party of 312.</div>
          </div>
          <div class="chat-line">
            <img
              class="badge"
              src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'%3E%3Crect width='18' height='18' rx='3' fill='%238b5cf6'/%3E%3C/svg%3E"
            /><span class="author" style="color: #ff7eb6">pixel_pirate</span
            ><span class="colon">: </span
            ><span class="message-body"
              >raid hype! <img class="emote" src="../logo.svg" alt="LurkEyes" title="LurkEyes"
            /></span>
          </div>
          <div class="chat-line">
            <span class="author" style="color: #7ee787">nightowl_dev</span
            ><span class="colon">: </span><span class="message-body">that refactor was clean</span>
          </div>
          <div class="chat-line">
            <img
              class="badge"
              src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'%3E%3Crect width='18' height='18' rx='3' fill='%230ea5e9'/%3E%3C/svg%3E"
            /><span class="author" style="color: #79c0ff">tabs_not_spaces</span
            ><span class="colon">: </span
            ><span class="message-body"
              ><span class="mention">@CozyCoder</span> which theme is that?</span
            >
          </div>
          <div class="chat-line">
            <span class="author" style="color: #d2a8ff">lurk_enjoyer</span
            ><span class="colon">: </span
            ><span class="message-body"
              >watching from my sidebar
              <img class="emote" src="../logo.svg" alt="LurkEyes" title="LurkEyes"
            /></span>
          </div>
          <div class="chat-line">
            <img
              class="badge"
              src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'%3E%3Crect width='18' height='18' rx='3' fill='%23f59e0b'/%3E%3C/svg%3E"
            /><img
              class="badge"
              src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'%3E%3Crect width='18' height='18' rx='3' fill='%238b5cf6'/%3E%3C/svg%3E"
            /><span class="author" style="color: #ffa657">merge_conflict</span
            ><span class="colon">: </span><span class="message-body">ship it</span>
          </div>
          <div class="chat-line">
            <span class="author" style="color: #56d4dd">semicolon_sam</span
            ><span class="colon">: </span><span class="message-body">GG</span>
          </div>
        </div>
      </div>
      <div class="chat-footer"><span>Read-only chat</span><a href="#">Chat on twitch.tv</a></div>
    </div>
  </body>
</html>
